<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Cats</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>

    
    
    <div id="Login" style="display: block;">
        <div>
            <H1>Movie Cats</H1>
        </div>
        <div class="imgcontainer">
        </div>
  
        <div class="container">
            <label for="uname"><b>Nombre de Usuario</b></label>
            <input type="text" placeholder="Enter Username" required id="userLogin">
  
            <label for="psw"><b>Clave</b></label>
            <input type="password" placeholder="Enter Password" required id="passwordLogin">
  
            <button type="submit" id="btn_login">Ingresar</button>
            <label>
                <input type="checkbox" name="admin" id="checkAdm"> Ingresar como Administrador
            </label>
        </div>
  
    </div>

    <div id="Admin" style="display: none;">
        <div id="cargasMasivas" style="width:70%; margin: auto;">
            <H1>Administrador</H1>
            <div class="input-group">
                <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Usuarios</button>
                <input type="file" class="form-control" id="masivaUsuarios" aria-describedby="inputGroupFileAddon04" aria-label="Upload" accept=".json">
            </div><br><br>
    
            <div class="input-group">
                <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Películas</button>
                <input type="file" class="form-control" id="masivaPelicula" aria-describedby="inputGroupFileAddon04" aria-label="Upload" accept=".json">
            </div><br><br>
    
            <div class="input-group">
                <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Actores</button>
                <input type="file" class="form-control" id="masivaActores" aria-describedby="inputGroupFileAddon04" aria-label="Upload" accept=".json">
            </div><br><br>
    
            <div class="input-group">
                <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Categorías</button>
                <input type="file" class="form-control" id="masivaCategorias" aria-describedby="inputGroupFileAddon04" aria-label="Upload" accept=".json">
            </div><br><br>

        </div>
    
        <div id="UsuariosAdmin" style="display: none; width: 70%; height: auto; margin: auto; scroll-behavior: auto;">
    
        </div>
    
        <div id="PeliculasAdmin" style="display: none; width: 70%; height: auto; margin: auto; scroll-behavior: auto;">
    
        </div>
    
        <div id="ActoresAdmin" style="display: none; width: 70%; height: auto; margin: auto; scroll-behavior: auto;">
    
        </div>
    
        <div id="CategoriasAdmin" style="display: none; width: 70%; height: auto; margin: auto; scroll-behavior: auto;">
    
        </div>
    </div>
    
    <div id="User" style="display: none;">
        <H1 id="welcome"></H1>
        <div id="bienvenida" style="display: none; width: 70%; height: auto; margin: auto;">
            
        </div>
    </div>






    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/@hpcc-js/wasm@0.3.11/dist/index.min.js"></script>   
    <script src="https://unpkg.com/d3-graphviz@3.0.5/build/d3-graphviz.js"></script>
    <script src="main.js"></script>
</body>
</html>
